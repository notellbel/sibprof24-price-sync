name: Обновление цен sibprof24

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install requests

      - name: Подготовить файл с ценами
        run: python update_prices.py

      - name: Сохранить файл с ценами в репозиторий
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price_feed.csv
          git diff --quiet --cached || git commit -m "Обновление цен: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Запустить импорт на сайте (Trigger)
        run: |
          curl -sS -o /dev/null -w "Trigger: HTTP %{http_code}\n" \
            "https://sibprof24.ru/wp-load.php?import_key=DFR3mTGU&import_id=77&action=trigger" || true

      - name: Подождать, пока сайт подготовится к обработке
        run: sleep 10

      - name: Выполнить импорт на сайте (Processing)
        run: |
          curl -sS -o /dev/null -w "Processing: HTTP %{http_code}\n" \
            "https://sibprof24.ru/wp-load.php?import_key=DFR3mTGU&import_id=77&action=processing" || true
