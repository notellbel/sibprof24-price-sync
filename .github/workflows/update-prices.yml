name: Обновление цен sibprof24

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install requests

      - name: Подготовить файл с ценами
        run: python update_prices.py

      - name: Сохранить файл с ценами в репозиторий
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price_feed.csv
          git diff --quiet --cached || git commit -m "Обновление цен: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
